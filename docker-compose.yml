# Royal Rose — production deployment for a single VPS that may host
# other projects. Every resource (containers, network, volumes, image)
# is prefixed `royalrose-*` so it cannot collide with anything else.
#
# Required: a sibling .env file (see .env.example). Never commit .env.
#
# Bring up:        docker compose up -d
# Logs:            docker compose logs -f app
# Down (keep data): docker compose down
# Reset DB:        docker compose down -v   (DESTRUCTIVE — drops named volume)
#
# Host paths consumed (created if missing):
#   ./uploads/                bind-mount → /app/uploads in container
#   ./data/postgres/          bind-mount → /var/lib/postgresql/data in db
#   ./backups/                local backup destination (not mounted)

name: royalrose

services:
  app:
    container_name: royalrose-app
    image: royalrose-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL is overridden here so the app talks to the in-network
      # `db` service hostname rather than whatever the host's .env points to.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 3000
      TZ: Australia/Sydney
    ports:
      # Bind to loopback only — Nginx on the host reverse-proxies to this.
      # If you don't have nginx yet, change to "0.0.0.0:3000:3000" — but
      # do that knowingly; it bypasses any TLS layer.
      - "127.0.0.1:3000:3000"
    volumes:
      # Bind mount uploads so the admin can SSH in and back up directly.
      # Source is created on first up if absent.
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - royalrose_net
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--tries=1", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  db:
    container_name: royalrose-db
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Force locale + encoding so future text fields don't surprise us.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Australia/Sydney
    # No `ports:` block on purpose. The database is reachable only via the
    # royalrose_net docker network — never exposed to the host or LAN.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - royalrose_net
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  royalrose_net:
    name: royalrose_net
    driver: bridge
